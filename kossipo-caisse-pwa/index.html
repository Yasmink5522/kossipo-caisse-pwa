/* ═══════════════════════════════════════════════════════════════════
   KOSSIPO CAISSE — Système de design
   Deux thèmes complets, une seule source de vérité pour les couleurs.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  /* Rayons, ombres, durées — constants entre les deux thèmes */
  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --t-vif:120ms cubic-bezier(.2,.8,.3,1);
  --t-doux:220ms cubic-bezier(.2,.8,.3,1);
  --rail:76px;
  --titrage:'Sora',Inter,-apple-system,'Segoe UI',system-ui,sans-serif;
}

/* ─── Thème sombre : service du soir, salle peu éclairée */
html[data-theme="sombre"]{
  --fond:#0C1114; --fond-2:#111A1E; --carte:#151F24; --releve:#1B272D;
  --trait:#25343B; --trait-fort:#31444C;
  --texte:#EBF1F3; --texte-2:#9CB0B9; --texte-3:#6C838D;
  --accent:#F0AB1E; --accent-2:#C4860D; --accent-doux:rgba(240,171,30,.14);
  --menthe:#31A894; --menthe-doux:rgba(49,168,148,.14);
  --azur:#4A94F5; --azur-doux:rgba(74,148,245,.14);
  --violet:#9370F0; --violet-doux:rgba(147,112,240,.14);
  --braise:#D07C42; --braise-doux:rgba(208,124,66,.14);
  --alerte:#E85D5D; --alerte-doux:rgba(232,93,93,.14);
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.9);
  --ombre-flottante:0 24px 60px -20px rgba(0,0,0,.85);
  --verre:rgba(21,31,36,.82);
}

/* ─── Thème clair : service du midi, terrasse en plein jour */
html[data-theme="clair"]{
  --fond:#EFF3F4; --fond-2:#F6F8F9; --carte:#FFFFFF; --releve:#F2F6F7;
  --trait:#DCE5E8; --trait-fort:#C3D1D6;
  --texte:#0C1114; --texte-2:#526670; --texte-3:#7B8E97;
  --accent:#B87B08; --accent-2:#8F5E04; --accent-doux:rgba(184,123,8,.10);
  --menthe:#1E7D6D; --menthe-doux:rgba(30,125,109,.10);
  --azur:#2A6FD4; --azur-doux:rgba(42,111,212,.10);
  --violet:#6B4BD1; --violet-doux:rgba(107,75,209,.10);
  --braise:#B25F27; --braise-doux:rgba(178,95,39,.10);
  --alerte:#C63B3B; --alerte-doux:rgba(198,59,59,.10);
  --ombre:0 1px 2px rgba(12,17,20,.06), 0 12px 28px -20px rgba(12,17,20,.35);
  --ombre-flottante:0 24px 56px -18px rgba(12,17,20,.28);
  --verre:rgba(255,255,255,.85);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--fond);color:var(--texte);
  font:15px/1.5 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;overflow:hidden;
  transition:background var(--t-doux),color var(--t-doux);
}
input,textarea,select{font:inherit;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,h4{margin:0;font-family:var(--titrage);letter-spacing:-.02em;font-weight:600}
.chiffre{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"ss01" 1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--trait);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--trait-fort);background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* ─── Ossature générale */
#racine{display:flex;height:100%}

aside.rail{
  width:var(--rail);flex:0 0 auto;background:var(--fond-2);border-right:1px solid var(--trait);
  display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:4px;z-index:20;
}
.logo-rail{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px;
  background:linear-gradient(145deg,var(--accent),var(--braise));color:#0C1114;
  font-family:var(--titrage);font-weight:700;font-size:19px;box-shadow:var(--ombre);
}
.rail-btn{
  width:56px;padding:9px 0 7px;border-radius:var(--r-sm);display:flex;flex-direction:column;
  align-items:center;gap:5px;color:var(--texte-3);position:relative;
  transition:color var(--t-vif),background var(--t-vif);
}
.rail-btn span{font-size:10px;font-weight:500;letter-spacing:.01em}
.rail-btn:hover{color:var(--texte-2);background:var(--releve)}
.rail-btn.actif{color:var(--accent);background:var(--accent-doux)}
.rail-btn.actif::before{
  content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--accent);
}
.rail-bas{margin-top:auto;display:flex;flex-direction:column;gap:4px;align-items:center}

.colonne{flex:1;min-width:0;display:flex;flex-direction:column}
header.barre{
  height:64px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 20px;
  border-bottom:1px solid var(--trait);background:var(--verre);backdrop-filter:blur(14px);z-index:10;
}
header.barre h1{font-size:19px}
header.barre .fil{font-size:12.5px;color:var(--texte-3);margin-top:1px}
.pousse{margin-left:auto}
.pastille-live{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--texte-2);
  padding:6px 11px;border-radius:99px;background:var(--releve);border:1px solid var(--trait);
}
.point-live{width:7px;height:7px;border-radius:50%;background:var(--menthe);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--menthe-doux)}50%{opacity:.55;box-shadow:0 0 0 6px transparent}}

main.scene{flex:1;min-height:0;position:relative}
.vue{position:absolute;inset:0;overflow:auto;padding:20px;display:none}
.vue.plein{padding:0}
.vue.active{display:block;animation:entree var(--t-doux)}
.vue.plein.active{display:flex}
@keyframes entree{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ─── Blocs */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-md);box-shadow:var(--ombre)}
.grille{display:grid;gap:14px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 17px;border-radius:var(--r-sm);font-size:14px;font-weight:600;
  background:var(--releve);border:1px solid var(--trait);color:var(--texte);
  transition:transform var(--t-vif),background var(--t-vif),border-color var(--t-vif),box-shadow var(--t-vif);
}
.btn:hover{border-color:var(--trait-fort);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.principal{background:var(--accent);border-color:var(--accent);color:#0C1114;box-shadow:0 6px 18px -10px var(--accent)}
.btn.principal:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.valide{background:var(--menthe);border-color:var(--menthe);color:#04120F}
.btn.risque{background:var(--alerte-doux);border-color:var(--alerte);color:var(--alerte)}
.btn.fantome{background:transparent}
.btn.petit{padding:7px 12px;font-size:12.5px;border-radius:var(--r-xs)}
.btn.large{width:100%}
.btn svg{width:17px;height:17px;flex:0 0 auto}

.champ{
  width:100%;padding:11px 14px;border-radius:var(--r-sm);background:var(--fond-2);
  border:1px solid var(--trait);color:var(--texte);transition:border-color var(--t-vif),box-shadow var(--t-vif);
}
.champ:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
.champ::placeholder{color:var(--texte-3)}
label.eti{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--texte-3);font-weight:600;margin-bottom:7px}

.puce{padding:4px 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.01em;display:inline-flex;align-items:center;gap:5px}
.puce.menthe{background:var(--menthe-doux);color:var(--menthe)}
.puce.accent{background:var(--accent-doux);color:var(--accent)}
.puce.azur{background:var(--azur-doux);color:var(--azur)}
.puce.violet{background:var(--violet-doux);color:var(--violet)}
.puce.alerte{background:var(--alerte-doux);color:var(--alerte)}
.puce.neutre{background:var(--releve);color:var(--texte-2)}

.vide{text-align:center;color:var(--texte-3);padding:56px 20px;font-size:14px}
.vide svg{width:38px;height:38px;opacity:.4;margin-bottom:12px}

/* ─── Recherche */
.recherche{position:relative;flex:1;max-width:420px}
.recherche svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--texte-3)}
.recherche input{padding-left:38px}

/* ─── Tuiles du tableau de bord */
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tuile{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-md);padding:17px;box-shadow:var(--ombre);position:relative;overflow:hidden;transition:transform var(--t-vif),border-color var(--t-vif)}
.tuile:hover{transform:translateY(-2px);border-color:var(--trait-fort)}
.tuile .haut{display:flex;justify-content:space-between;align-items:flex-start}
.tuile .icone{width:34px;height:34px;border-radius:var(--r-xs);display:grid;place-items:center}
.tuile .icone svg{width:17px;height:17px}
.tuile .lib{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--texte-3);font-weight:600}
.tuile .val{font-family:var(--titrage);font-size:26px;font-weight:700;margin-top:9px;letter-spacing:-.03em}
.tuile .det{font-size:12px;color:var(--texte-3);margin-top:4px}

/* ─── Plan de salle */
.zones-onglets{display:flex;gap:7px;padding:14px 20px;border-bottom:1px solid var(--trait);overflow-x:auto;flex:0 0 auto}
.zone-onglet{padding:9px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--texte-3);border:1px solid transparent;white-space:nowrap;transition:all var(--t-vif);display:flex;align-items:center;gap:8px}
.zone-onglet:hover{color:var(--texte-2)}
.zone-onglet.actif{background:var(--carte);border-color:var(--trait);color:var(--texte);box-shadow:var(--ombre)}
.rond{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.salle{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding:20px;align-content:start}
.table-carte{
  position:relative;text-align:left;background:var(--carte);border:1px solid var(--trait);
  border-radius:var(--r-md);padding:15px;overflow:hidden;box-shadow:var(--ombre);
  transition:transform var(--t-vif),border-color var(--t-vif),box-shadow var(--t-vif);
}
.table-carte:hover{transform:translateY(-3px);border-color:var(--trait-fort);box-shadow:var(--ombre-flottante)}
.table-carte .liseret{position:absolute;left:0;top:0;bottom:0;width:4px}
.table-carte .halo{position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;opacity:.10}
.table-carte .no{font-family:var(--titrage);font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
.table-carte .places{font-size:11.5px;color:var(--texte-3)}
.table-carte .bas{margin-top:14px;padding-top:12px;border-top:1px solid var(--trait)}
.table-carte .somme{font-family:var(--titrage);font-size:17px;font-weight:600}
.table-carte .info{font-size:11.5px;color:var(--texte-3);margin-top:2px}

/* ─── Prise de commande */
.ecran-commande{display:flex;flex:1;min-height:0;width:100%}
.panneau-carte{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--trait)}
.barre-carte{display:flex;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--trait);flex:0 0 auto}
.familles{display:flex;gap:6px;padding:11px 16px;border-bottom:1px solid var(--trait);overflow-x:auto;flex:0 0 auto}
.famille{padding:8px 15px;border-radius:99px;font-size:13px;font-weight:600;color:var(--texte-3);border:1px solid transparent;white-space:nowrap;transition:all var(--t-vif)}
.famille.actif{background:var(--accent-doux);color:var(--accent);border-color:var(--accent)}
.plats{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;align-content:start}
.plat{
  position:relative;text-align:left;background:var(--carte);border:1px solid var(--trait);
  border-radius:var(--r-md);padding:15px;min-height:104px;display:flex;flex-direction:column;
  justify-content:space-between;overflow:hidden;box-shadow:var(--ombre);
  transition:transform var(--t-vif),border-color var(--t-vif);
}
.plat:hover{transform:translateY(-2px);border-color:var(--accent)}
.plat:active{transform:scale(.97)}
.plat .nom{font-size:14px;font-weight:500;line-height:1.35}
.plat .tarif{font-family:var(--titrage);font-weight:600;color:var(--accent);margin-top:10px}
.plat .marque{position:absolute;top:11px;right:11px;width:6px;height:6px;border-radius:50%}

.panneau-ticket{width:392px;flex:0 0 auto;display:flex;flex-direction:column;background:var(--fond-2)}
.ticket-tete{padding:16px;border-bottom:1px solid var(--trait);flex:0 0 auto}
.ticket-lignes{flex:1;overflow:auto;padding:12px 16px}
.ligne-art{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px;animation:entree var(--t-vif)}
.ligne-art .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ligne-art .b{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11.5px;color:var(--texte-3)}
.compteur{display:flex;align-items:center;gap:2px;background:var(--fond-2);border-radius:99px;padding:2px}
.compteur button{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:var(--texte-2);transition:background var(--t-vif),color var(--t-vif)}
.compteur button:hover{background:var(--releve);color:var(--texte)}
.compteur .q{min-width:22px;text-align:center;font-weight:600;font-size:13px;color:var(--texte)}
.ticket-pied{flex:0 0 auto;border-top:1px solid var(--trait);padding:14px 16px}
.somme-ligne{display:flex;justify-content:space-between;font-size:13px;color:var(--texte-2);margin-bottom:6px}
.somme-totale{display:flex;justify-content:space-between;align-items:baseline;padding-top:11px;margin-top:6px;border-top:1px solid var(--trait)}
.somme-totale .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--texte-3);font-weight:600}
.somme-totale .v{font-family:var(--titrage);font-size:30px;font-weight:700;letter-spacing:-.03em}
.actions-ticket{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}

/* ─── Tableaux */
table.tab{width:100%;border-collapse:collapse}
table.tab th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--texte-3);font-weight:600;padding:13px 16px;border-bottom:1px solid var(--trait)}
table.tab td{padding:13px 16px;border-bottom:1px solid var(--trait);font-size:13.5px}
table.tab tbody tr{transition:background var(--t-vif)}
table.tab tbody tr:hover{background:var(--releve)}
table.tab tbody tr:last-child td{border-bottom:0}
.d{text-align:right}

/* ─── Fenêtres modales */
.voile{position:fixed;inset:0;background:rgba(4,8,10,.66);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80;animation:fondu var(--t-vif)}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.fenetre{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-lg);width:100%;max-width:470px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--ombre-flottante);animation:surgit var(--t-doux)}
.fenetre.large{max-width:880px}
@keyframes surgit{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.fenetre .tete{display:flex;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--trait)}
.fenetre .tete h3{font-size:17px}
.fenetre .tete p{margin:4px 0 0;font-size:13px;color:var(--texte-3)}
.fenetre .corps{padding:18px 20px;overflow:auto}
.fenetre .pied{padding:15px 20px;border-top:1px solid var(--trait);display:flex;gap:9px;justify-content:flex-end}
.croix{width:32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--texte-3);transition:all var(--t-vif)}
.croix:hover{background:var(--releve);color:var(--texte)}
.croix svg{width:17px;height:17px}

/* ─── Pavé numérique */
.afficheur{background:var(--fond-2);border:1px solid var(--trait);border-radius:var(--r-md);padding:16px 18px;text-align:right;font-family:var(--titrage);font-size:33px;font-weight:700;letter-spacing:-.03em}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pave button{padding:16px 0;border-radius:var(--r-sm);background:var(--releve);border:1px solid var(--trait);font-family:var(--titrage);font-size:19px;font-weight:600;transition:all var(--t-vif)}
.pave button:hover{background:var(--trait);transform:translateY(-1px)}
.pave button:active{transform:scale(.95)}
.coupures{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.coupures button{padding:10px 0;border-radius:var(--r-xs);background:var(--releve);border:1px solid var(--trait);font-size:12px;font-weight:600;transition:all var(--t-vif)}
.coupures button:hover{border-color:var(--accent);color:var(--accent)}

/* ─── Moyens de paiement */
.paiements{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.moyen{padding:13px 8px;border-radius:var(--r-sm);background:var(--releve);border:1.5px solid var(--trait);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;transition:all var(--t-vif)}
.moyen:hover{border-color:var(--trait-fort);transform:translateY(-2px)}
.moyen.actif{border-color:var(--accent);background:var(--accent-doux);color:var(--accent)}
.moyen .rondelle{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--titrage);font-weight:700;font-size:12px;color:#fff}

/* ─── Écran cuisine */
.bons{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:20px;align-content:start}
.bon{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--menthe);border-radius:var(--r-md);display:flex;flex-direction:column;box-shadow:var(--ombre);animation:entree var(--t-doux)}
.bon.tiede{border-left-color:var(--accent)}
.bon.chaud{border-left-color:var(--alerte);animation:respire 2.4s infinite}
@keyframes respire{0%,100%{box-shadow:var(--ombre)}50%{box-shadow:0 0 0 3px var(--alerte-doux),var(--ombre)}}
.bon .tete{padding:14px 15px;border-bottom:1px solid var(--trait);display:flex;justify-content:space-between;align-items:flex-start}
.bon .items{padding:12px 15px;flex:1}
.bon .item{display:flex;gap:11px;margin-bottom:9px}
.bon .item .q{font-family:var(--titrage);font-weight:700;color:var(--accent);min-width:26px}
.bon .pied{padding:0 15px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ─── Notifications */
#avis{position:fixed;top:16px;right:16px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:min(360px,calc(100vw - 32px))}
.avis{
  padding:13px 16px;border-radius:var(--r-sm);font-size:13.5px;background:var(--carte);
  border:1px solid var(--trait);box-shadow:var(--ombre-flottante);display:flex;gap:11px;align-items:flex-start;
  animation:glisse var(--t-doux);
}
@keyframes glisse{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.avis svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.avis.succes{border-color:var(--menthe);color:var(--menthe)}
.avis.erreur{border-color:var(--alerte);color:var(--alerte)}
.avis.info{color:var(--texte)}

/* ─── Écran de connexion */
#connexion{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:var(--fond);overflow:auto}
#connexion.visible{display:flex}
.decor{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bulle{position:absolute;border-radius:50%;filter:blur(80px);opacity:.30}
.bulle.a{width:460px;height:460px;background:var(--accent);top:-140px;left:-110px;animation:derive 22s ease-in-out infinite}
.bulle.b{width:400px;height:400px;background:var(--menthe);bottom:-150px;right:-90px;animation:derive 27s ease-in-out infinite reverse}
.bulle.c{width:300px;height:300px;background:var(--braise);top:44%;left:56%;animation:derive 19s ease-in-out infinite}
@keyframes derive{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.09)}66%{transform:translate(-30px,26px) scale(.94)}}
.bloc-connexion{position:relative;width:100%;max-width:412px;z-index:2}
.logo-grand{
  width:74px;height:74px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--braise));color:#0C1114;
  font-family:var(--titrage);font-weight:700;font-size:30px;box-shadow:0 20px 44px -18px var(--accent);
  animation:pose .7s cubic-bezier(.2,.9,.3,1);
}
@keyframes pose{from{opacity:0;transform:translateY(-18px) scale(.85) rotate(-7deg)}to{opacity:1;transform:none}}
.points-pin{display:flex;justify-content:center;gap:13px;height:16px;margin:22px 0}
.pt{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--trait);transition:all var(--t-vif)}
.pt.plein{background:var(--accent);border-color:var(--accent);transform:scale(1.14)}
.secoue{animation:secousse .4s}
@keyframes secousse{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.profils{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.profil{padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--releve);border:1px solid var(--trait);color:var(--texte-2);transition:all var(--t-vif)}
.profil.actif{border-color:var(--accent);color:var(--accent);background:var(--accent-doux)}

/* ─── Adaptation tablette et téléphone */
@media(max-width:1000px){
  .panneau-ticket{width:340px}
  .plats{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
}
@media(max-width:820px){
  #racine{flex-direction:column-reverse}
  aside.rail{width:100%;flex-direction:row;justify-content:space-around;padding:6px 4px;
    border-right:0;border-top:1px solid var(--trait);overflow-x:auto}
  .logo-rail,.rail-bas{display:none}
  .rail-btn{width:auto;min-width:58px;padding:7px 6px}
  .rail-btn.actif::before{left:50%;top:auto;bottom:-6px;transform:translateX(-50%);width:20px;height:3px;border-radius:3px 3px 0 0}
  .ecran-commande{flex-direction:column}
  .panneau-carte{border-right:0;border-bottom:1px solid var(--trait);min-height:46%}
  .panneau-ticket{width:100%;flex:1;min-height:0}
  header.barre{height:56px;padding:0 14px}
  .vue{padding:14px}
  .salle{padding:14px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
}

/* ─── Impression : le reste de l'écran disparaît */
#feuille{display:none}
@media print{
  body{overflow:visible;background:#fff}
  #racine,#avis,#fenetres,#connexion{display:none!important}
  #feuille{display:block!important;font-family:"Courier New",Consolas,monospace;font-size:12px;line-height:1.36;color:#000}
  .recu{padding:0 1mm}
  .recu .c{text-align:center}
  .recu .g{font-weight:700}
  .recu .gr{font-size:16px}
  .recu .tt{font-size:19px;font-weight:700;letter-spacing:.04em}
  .recu hr{border:0;border-top:1px dashed #000;margin:5px 0}
  .recu table{width:100%;border-collapse:collapse}
  .recu td.d{text-align:right;white-space:nowrap;padding-left:7px}
  .rapport{font-family:Inter,sans-serif;font-size:11pt;color:#000;padding:6mm}
  .rapport h1{font-size:19pt;margin:0 0 3mm}
  .rapport h2{font-size:13pt;margin:6mm 0 2mm;border-bottom:1px solid #000;padding-bottom:1mm}
  .rapport table{width:100%;border-collapse:collapse;margin-bottom:4mm}
  .rapport th{text-align:left;border-bottom:1.5px solid #000;padding:2mm 1mm;font-size:9pt;text-transform:uppercase;letter-spacing:.08em}
  .rapport td{border-bottom:.5px solid #bbb;padding:2mm 1mm}
  .rapport .d{text-align:right}
  @page{margin:4mm}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  };

let etat = charger();

function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut) return fusion(etatNeuf(), JSON.parse(brut));
    // Reprise des données de la version 1 : la carte et les ventes sont conservées.
    const ancien = localStorage.getItem(CLE_V1);
    if(ancien){
      const v1 = JSON.parse(ancien);
      const neuf = etatNeuf();
      if(v1.carte) neuf.carte = v1.carte.map(k=>({ famille:k.cat, poste:k.dest==='BAR'?'BAR':'CUISINE', produits:k.produits }));
      if(v1.zones) neuf.zones = v1.zones;
      if(v1.params) Object.assign(neuf.params, { nom:v1.params.nom, adresse:v1.params.adresse,
        tel:v1.params.tel, pied:v1.params.pied, largeur:v1.params.largeur, mode:v1.params.mode });
      if(v1.historique) neuf.historique = v1.historique;
      if(v1.compteur) neuf.compteur = v1.compteur;
      return neuf;
    }
    return etatNeuf();
  }catch(e){ return etatNeuf(); }
}

/* Fusion prudente : les clés absentes du fichier gardent leur valeur par défaut. */
function fusion(base, lu){
  Object.keys(lu||{}).forEach(k=>{
    if(lu[k] && typeof lu[k]==='object' && !Array.isArray(lu[k]) && base[k] && typeof base[k]==='object' && !Array.isArray(base[k]))
      base[k] = Object.assign(base[k], lu[k]);
    else if(lu[k] !== undefined) base[k] = lu[k];
  });
  return base;
}

  const m = minutesDepuis(iso);

}

/* TVA : le paramétrage accepte un prix taxe comprise ou hors taxe. */
function ventilationTva(total){
  const taux = Number(etat.params.tva)||0;
  if(!taux) return { ht:total, tva:0, ttc:total, taux:0 };
  if(etat.params.tvaIncluse){
    const ht = Math.round(total/(1+taux/100));
    return { ht, tva:total-ht, ttc:total, taux };
  }
  const tva = Math.round(total*taux/100);
  return { ht:total, tva, ttc:total+tva, taux };
}

/* Consommation automatique du stock selon les fiches techniques. */
function consommerStock(lignes, ref){
  const besoins = {};
  lignes.forEach(l=>{
    (etat.recettes[l.nom]||[]).forEach(([article,q])=>{ besoins[article] = (besoins[article]||0) + q*l.qte; });
  });
  const alertes = [];
  Object.entries(besoins).forEach(([nomArticle,q])=>{
    const a = etat.stock.find(x=>x.nom===nomArticle);
    if(!a) return;
    const avant = a.qte;
    a.qte = Math.round((a.qte - q)*1000)/1000;
    etat.mouvements.unshift({ t:new Date().toISOString(), article:a.nom, type:'VENTE',
      qte:q, avant, apres:a.qte, motif:'Vente '+ref, par:etat.session?.nom||'' });
    if(a.qte <= a.seuil) alertes.push(a.nom);
  });
  if(etat.mouvements.length > 500) etat.mouvements.length = 500;
  if(alertes.length) avis('erreur','Stock bas : '+alertes.slice(0,3).join(', '));
}

function ticketDe(c, type, lignesChoisies){
  const production = type==='CUISINE' || type==='BAR';
  const lignes = lignesChoisies || c.lignes;
  const brut = lignes.reduce((s,l)=>s+l.pu*l.qte,0);
  const tva = ventilationTva(Math.max(0, brut-(c.remise||0)));
  const d = new Date();
  return {
    type, production, largeur: Number(etat.params.largeur)===58?58:80,
    titre: production ? (type==='CUISINE'?'CUISINE':'BAR') : etat.params.nom,
    adresse: etat.params.adresse, tel: etat.params.tel,
    numero: c.num, date: dateFR(d), heure: hhmm(d),
    zone: c.zoneNom, table: c.tableNom, serveur: c.serveur, couverts: c.couverts,
    lignes: lignes.map(l=>({ nom:l.nom, qte:l.qte, pu:l.pu, total:l.pu*l.qte, note:l.note })),
    sousTotal: brut, remise: c.remise||0, total: tva.ttc, tva,
    paiements: (type==='RECU' && c.paiements) ? c.paiements : null,
    recu: (type==='RECU' && c.paiements) ? c.paiements.reduce((s,p)=>s+(p.recu||p.montant),0) : null,
    rendu:(type==='RECU' && c.paiements) ? c.paiements.reduce((s,p)=>s+(p.rendu||0),0) : null,
    pied: production ? 'Bon '+c.num
        : type==='ADDITION' ? 'ADDITION — non réglée'
        : etat.params.pied,
    copie: type==='RECU' && c.reimpression ? 'DUPLICATA' : '',
  };
}

function ticketTexte(t){
  const L = t.largeur===58 ? 32 : 48;
  const coupe = (s,n)=> s.length>n ? s.slice(0,n) : s;
  const centre = s => { s = coupe(s,L); return ' '.repeat(Math.floor((L-s.length)/2))+s; };
  const deux = (g,d)=>{ d = coupe(d,L-2); g = coupe(g,L-d.length-1);
    return g+' '.repeat(Math.max(1,L-g.length-d.length))+d; };
  const trait = ch => ch.repeat(L);
  const dateAff = L===32 ? t.date.slice(0,5) : t.date;
  const o = [];

  if(t.copie) o.push(centre('*** '+t.copie+' ***'));
  o.push(centre(t.titre.toUpperCase()));
  if(!t.production && t.adresse) o.push(centre(t.adresse));
  if(!t.production && t.tel) o.push(centre(t.tel));
  o.push(trait('='));
  o.push(deux('N° '+t.numero, dateAff+' '+t.heure));
  o.push(deux(t.zone, t.table));
  o.push(deux('Couverts: '+t.couverts, t.serveur));
  o.push(trait('='));
  t.lignes.forEach(x=>{
    if(t.production){ o.push(x.qte+' x '+x.nom); if(x.note) o.push('   >> '+x.note); }
    else { o.push(coupe(x.nom,L)); o.push(deux('  '+x.qte+' x '+nb(x.pu), nb(x.total)));
           if(x.note) o.push('   ('+x.note+')'); }
  });
  if(!t.production){
    o.push(trait('-'));
    if(t.remise>0){ o.push(deux('Sous-total', nb(t.sousTotal))); o.push(deux('Remise','-'+nb(t.remise))); }
    o.push(deux('TOTAL', nb(t.total)+' '+etat.params.devise));
    if(t.tva.taux) o.push(deux('dont TVA '+t.tva.taux+'%', nb(t.tva.tva)));
    if(t.paiements){
      o.push(trait('-'));
      t.paiements.forEach(p=>o.push(deux(MOYENS[p.moyen]?.lib||p.moyen, nb(p.montant))));
      if(t.recu) o.push(deux('Reçu', nb(t.recu)));
      if(t.rendu>0) o.push(deux('Monnaie rendue', nb(t.rendu)));
    }
  }
  o.push(trait('='));
  o.push(centre(t.pied));
  return o.join('\n')+'\n';
}

/* Table de conversion CP858 : les accents sortent correctement en ESC/POS. */
const CP858 = {'é':0x82,'è':0x8a,'ê':0x88,'ë':0x89,'à':0x85,'â':0x83,'ä':0x84,'î':0x8c,'ï':0x8b,
  'ô':0x93,'ö':0x94,'ù':0x97,'û':0x96,'ü':0x81,'ç':0x87,'É':0x90,'È':0xd4,'Ê':0xd2,'À':0xb7,
  'Ç':0x80,'Ô':0xe2,'°':0xf8,'«':0xae,'»':0xaf,'’':0x27,'–':0x2d,'\u202f':0x20};

function octetsESCPOS(t){
  const o = [0x1b,0x40, 0x1b,0x74,0x13];
  const lignes = ticketTexte(t).split('\n');
  lignes.forEach((l,i)=>{
    const fort = i===0 || l.startsWith('TOTAL');
    o.push(0x1b,0x61, i===0?1:0);
    if(fort){ o.push(0x1b,0x45,1); o.push(0x1d,0x21,0x11); }
    for(const ch of l.normalize('NFC')) o.push(CP858[ch] ?? (ch.charCodeAt(0)&0xff));
    o.push(0x0a);
    if(fort){ o.push(0x1d,0x21,0x00); o.push(0x1b,0x45,0); }
  });
  o.push(0x1b,0x64,0x03, 0x1d,0x56,0x42,0x00);
  return new Uint8Array(o);
}

let bt = { device:null, carac:null };

async function connecterBluetooth(){
  if(!navigator.bluetooth) throw new Error('Bluetooth indisponible : utilisez Chrome sur Android ou Windows');
  const device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[
    '000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb',
    '0000ffe0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455',
    'e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
  const serveur = await device.gatt.connect();
  for(const service of await serveur.getPrimaryServices()){
    for(const c of await service.getCharacteristics()){
      if(c.properties.write || c.properties.writeWithoutResponse){
        bt = { device, carac:c };
        device.addEventListener('gattserverdisconnected', ()=>{ bt.carac = null; });
        return device.name || 'Imprimante';
      }
    }
  }
  throw new Error('Aucune voie d\'écriture sur cet appareil');
}

async function imprimer(t){
  try{
    if(etat.params.mode === 'rawbt'){
      window.location.href = 'rawbt:' + encodeURIComponent(ticketTexte(t)+'\n\n\n');
      return;
    }
    if(etat.params.mode === 'bluetooth'){
      if(!bt.carac) avis('info','Connexion à l\'imprimante : '+await connecterBluetooth());
      const d = octetsESCPOS(t);
      for(let i=0;i<d.length;i+=180){
        const bloc = d.slice(i,i+180);
        if(bt.carac.properties.writeWithoutResponse) await bt.carac.writeValueWithoutResponse(bloc);
        else await bt.carac.writeValue(bloc);
        await new Promise(r=>setTimeout(r,22));
      }
      return;
    }
    imprimerFeuille(ticketHTML(t));
  }catch(e){ avis('erreur','Impression : '+(e.message||e)); }
}

/* Pavé numérique partagé par les montants, les quantités et les codes PIN. */
function pave({titre, sous, valeur='', coupures=[], valider, libelle='Valider'}){
  let v = String(valeur);
  const dessin = ()=>`
    <div class="afficheur chiffre">${v===''?'0':nb(Number(v))}</div>
    ${coupures.length?`<div class="coupures">${coupures.map(c=>`<button data-c="${c}" class="chiffre">${nb(c)}</button>`).join('')}</div>`:''}
    <div class="pave">${['7','8','9','4','5','6','1','2','3','00','0','←'].map(t=>`<button data-t="${t}">${t}</button>`).join('')}</div>`;

  fenetre({ titre, sous, corps:dessin(),
    pied:`<button class="btn fantome" data-a>Annuler</button><button class="btn principal" data-v>${echap(libelle)}</button>`,
    apres:(fen,fermer)=>{
      const refaire = ()=>{ $('.corps',fen).innerHTML = dessin(); brancher(); };
      const brancher = ()=>{
        $$('[data-t]',fen).forEach(b=>b.onclick=()=>{
          const t = b.dataset.t;
          if(t==='←') v = v.slice(0,-1);
          else if(t==='00') v = v===''?'':v+'00';
          else if(v.length<9) v = (v+t).replace(/^0+(?=\d)/,'');
          refaire();
        });
        $$('[data-c]',fen).forEach(b=>b.onclick=()=>{ v = b.dataset.c; refaire(); });
      };
      brancher();
      $('[data-a]',fen).onclick = fermer;
      $('[data-v]',fen).onclick = ()=>{ fermer(); valider(Number(v||0)); };
    }});
}

/* Opération sensible : exige le code PIN d'un gérant ou d'un administrateur. */
function autoriser(motif, action){
  let saisie = '';
  const dessin = ()=>`
    <p style="color:var(--texte-2);font-size:13.5px;margin:0 0 16px">${echap(motif)}</p>
    <div class="points-pin">${Array.from({length:Math.max(4,saisie.length)},(_,i)=>
      `<span class="pt ${i<saisie.length?'plein':''}"></span>`).join('')}</div>
    <div class="pave">${['1','2','3','4','5','6','7','8','9','C','0','←'].map(t=>`<button data-t="${t}">${t}</button>`).join('')}</div>`;

  fenetre({ titre:'Autorisation requise', sous:'Code d\'un gérant ou administrateur', corps:dessin(),
    apres:(fen,fermer)=>{
      const refaire = ()=>{ $('.corps',fen).innerHTML = dessin(); brancher(); };
      const brancher = ()=>$$('[data-t]',fen).forEach(b=>b.onclick=()=>{
        const t = b.dataset.t;
        if(t==='C') saisie='';
        else if(t==='←') saisie = saisie.slice(0,-1);
        else if(saisie.length<8) saisie += t;
        refaire();
        if(saisie.length>=4){
          const u = etat.utilisateurs.find(x=>x.actif && x.pin===saisie && ['ADMIN','GERANT'].includes(x.role));
          if(u){ fermer(); action(u); }
          else if(saisie.length>=Math.max(4, etat.utilisateurs.reduce((m,x)=>Math.max(m,x.pin.length),4))){
            $('.fenetre',fen).classList.add('secoue');
            setTimeout(()=>{ saisie=''; refaire(); $('.fenetre',fen).classList.remove('secoue'); }, 420);
          }
        }
      });
      brancher();
    }});
}

/* ═══ 7. ÉCRAN DE CONNEXION ═════════════════════════════════════════ */

let pinSaisi = '';
let profilChoisi = null;

function rendreConnexion(){
  const bloc = $('#connexion');
  bloc.classList.add('visible');
  const actifs = etat.utilisateurs.filter(u=>u.actif);

  bloc.innerHTML = `
    <div class="decor"><span class="bulle a"></span><span class="bulle b"></span><span class="bulle c"></span></div>
    <div class="bloc-connexion">
      <div style="text-align:center;margin-bottom:26px">
        <div class="logo-grand">K</div>
        <h1 style="font-size:25px">KOSSIPO</h1>
        <p style="color:var(--texte-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.26em;margin:6px 0 0">
          Terminal de caisse</p>
      </div>

      <div class="carte" style="padding:24px">
        <div class="profils">
          ${actifs.map(u=>`<button class="profil ${profilChoisi===u.id?'actif':''}" data-u="${u.id}">${echap(u.nom)}</button>`).join('')}
        </div>

        <div class="points-pin" id="pts">
          ${Array.from({length:Math.max(4,pinSaisi.length)},(_,i)=>
            `<span class="pt ${i<pinSaisi.length?'plein':''}"></span>`).join('')}
        </div>

        <div class="pave">
          ${['1','2','3','4','5','6','7','8','9','C','0','←'].map(t=>`<button data-t="${t}">${t}</button>`).join('')}
        </div>

        <p style="text-align:center;color:var(--texte-3);font-size:12px;margin:18px 0 0">
          Saisissez votre code — la session s'ouvre automatiquement.</p>
      </div>

      <div style="display:flex;justify-content:center;gap:10px;margin-top:20px">
        <button class="btn petit fantome" id="basculeTheme">
          ${ico(etat.theme==='sombre'?'soleil':'lune',15)} ${etat.theme==='sombre'?'Mode clair':'Mode sombre'}</button>
        <span class="btn petit fantome" style="pointer-events:none;color:var(--texte-3)">Version ${VERSION}</span>
      </div>
    </div>`;

  $$('.profil',bloc).forEach(b=>b.onclick=()=>{ profilChoisi = b.dataset.u; pinSaisi=''; rendreConnexion(); });
  $$('[data-t]',bloc).forEach(b=>b.onclick=()=>frapper(b.dataset.t));
  $('#basculeTheme',bloc).onclick = ()=>{ basculerTheme(); rendreConnexion(); };
}

function frapper(t){
  if(t==='C') pinSaisi = '';
  else if(t==='←') pinSaisi = pinSaisi.slice(0,-1);
  else if(pinSaisi.length < 8) pinSaisi += t;

  // Mise à jour ciblée des points : plus fluide qu'un rendu complet.
  const pts = $('#pts');
  if(pts) pts.innerHTML = Array.from({length:Math.max(4,pinSaisi.length)},(_,i)=>
    `<span class="pt ${i<pinSaisi.length?'plein':''}"></span>`).join('');

  if(pinSaisi.length >= 4) tenterConnexion();
}

function tenterConnexion(){
  const candidats = etat.utilisateurs.filter(u=>u.actif && (!profilChoisi || u.id===profilChoisi));
  const u = candidats.find(x=>x.pin === pinSaisi);
  if(u){
    etat.session = { id:u.id, nom:u.nom, role:u.role, depuis:new Date().toISOString() };
    tracer(u.nom+' a ouvert une session','info');
    pinSaisi = ''; profilChoisi = null;
    sauver();
    // L'écran de connexion est vidé, pas seulement masqué : ses boutons ne
    // doivent plus exister derrière l'application (conflits de sélecteurs).
    const bloc = $('#connexion');
    bloc.classList.remove('visible');
    bloc.innerHTML = '';
    aller(peut('tableau') ? 'tableau' : peut('salle') ? 'salle' : 'cuisine');
    avis('succes','Bonjour '+u.nom);
    return;
  }
  const longueurMax = etat.utilisateurs.reduce((m,x)=>Math.max(m,x.pin.length),4);
  if(pinSaisi.length >= longueurMax){
    const carte = $('#connexion .carte');
    carte?.classList.add('secoue');
    setTimeout(()=>{ pinSaisi=''; carte?.classList.remove('secoue'); rendreConnexion(); }, 430);
  }
}

function deconnecter(){
  tracer((etat.session?.nom||'Un utilisateur')+' a fermé sa session');
  etat.session = null; sauver();
  rendreConnexion();
}

function basculerTheme(){
  etat.theme = etat.theme==='sombre' ? 'clair' : 'sombre';
  document.documentElement.dataset.theme = etat.theme;
  sauver();
}

/* ═══ 9. TABLEAU DE BORD ════════════════════════════════════════════ */

function statsJour(d = jourISO()){
  const tickets = etat.historique.filter(c=>c.payeA && c.payeA.slice(0,10)===d);
  return {
    tickets,
    ca: tickets.reduce((s,c)=>s+c.total,0),
    couverts: tickets.reduce((s,c)=>s+c.couverts,0),
    plats: tickets.reduce((s,c)=>s+c.lignes.reduce((n,l)=>n+l.qte,0),0),
  };
}

function statsMois(){
  const p = jourISO().slice(0,7);
  const tickets = etat.historique.filter(c=>c.payeA && c.payeA.slice(0,7)===p);
  return { ca: tickets.reduce((s,c)=>s+c.total,0), tickets };
}

/* Histogramme SVG : aucune bibliothèque, un rendu net à toute taille. */
function histogramme(points, couleur='var(--accent)', hauteur=150){
  if(!points.length) return `<div class="vide">${ico('rapport',38)}<div>Aucune donnée sur la période.</div></div>`;
  const max = Math.max(1, ...points.map(p=>p.v));
  return `<div style="display:flex;align-items:flex-end;gap:5px;height:${hauteur}px;padding-top:16px">
    ${points.map(p=>`
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative" title="${echap(p.l)} · ${fcfa(p.v)}">
        <div style="height:${Math.max(2,(p.v/max)*100)}%;background:${couleur};border-radius:5px 5px 2px 2px;opacity:.9;
                    transition:height var(--t-doux)"></div>
      </div>`).join('')}
  </div>
  <div style="display:flex;gap:5px;margin-top:8px">
    ${points.map((p,i)=>`<span style="flex:1;text-align:center;font-size:10px;color:var(--texte-3)">${
      points.length>12 && i%2 ? '' : echap(p.l)}</span>`).join('')}
  </div>`;
}

    <div class="zones-onglets">

        const occ = Array.from({length:z.tables},(_,i)=>infoTable(cleTable(z.id,i+1))).filter(t=>t.statut!=='LIBRE').length;
        return `<button class="zone-onglet ${z.id===zoneActive?'actif':''}" data-z="${z.id}">
          <span class="rond" style="background:${z.couleur}"></span>${echap(z.nom)}
          <span class="puce neutre chiffre">${occ}/${z.tables}</span></button>`;

function vignetteTable(zone,n){
  const cle = cleTable(zone.id,n);
  const info = infoTable(cle);
  const e = ETATS[info.statut] || ETATS.LIBRE;
  const c = info.commandeId ? etat.encours[info.commandeId] : null;
  return `<button class="table-carte" data-cle="${cle}">
    <span class="liseret" style="background:${e.c}"></span>
    <span class="halo" style="background:${e.c}"></span>

        <span class="places" style="display:block;margin-top:3px">${zone.grille==='vip'?6:4} places</span></span>

             <span class="info" style="display:block">${c.couverts} couvert${c.couverts>1?'s':''} · ${ecoule(c.ouvertA)}</span>`
          : `<span class="info" style="display:block">Toucher pour ouvrir</span>`}
    </span>
  </button>`;

function toucherTable(cle){
  const info = infoTable(cle);
  if(info.commandeId && etat.encours[info.commandeId]) return aller('commande', info.commandeId);
  if(info.statut === 'PAYEE'){
    etat.tables[cle] = { statut:'LIBRE', commandeId:null };
    sauver(); vueSalle();
    return avis('succes','Table libérée');
  }
  const zoneId = cle.slice(0, cle.lastIndexOf('-'));
  const n = cle.slice(cle.lastIndexOf('-')+1);
  const zone = zoneDe(zoneId);

  fenetre({ titre:`${zone.nom} — table ${n}`, sous:'Nombre de couverts',
    corps:`<div class="grille" style="grid-template-columns:repeat(5,1fr)">
      ${[1,2,3,4,5,6,7,8,10,12].map(v=>`<button class="btn" data-cv="${v}" style="padding:16px 0;font-family:var(--titrage);font-size:17px">${v}</button>`).join('')}
    </div>`,
    apres:(f,fermer)=>$$('[data-cv]',f).forEach(b=>b.onclick=()=>{
      ouvrirTable(cle, zone, Number(n), Number(b.dataset.cv)); fermer();
    })});
}

function ouvrirTable(cle, zone, numero, couverts){
  const id = 'c'+Date.now().toString(36);
  etat.encours[id] = {
    id, num:numeroTicket(), zoneId:zone.id, zoneNom:zone.nom, grille:zone.grille,
    boissonLibre:zone.boissonLibre, tableCle:cle, tableNom:`${zone.nom} ${numero}`,
    couverts, lignes:[], remise:0, statut:'OCCUPEE',
    ouvertA:new Date().toISOString(), paiements:[], serveur:etat.session.nom,
  };
  etat.tables[cle] = { statut:'OCCUPEE', commandeId:id };
  tracer(etat.session.nom+' a ouvert '+etat.encours[id].tableNom);
  sauver();
  aller('commande', id);
}

/* ═══ 11. PRISE DE COMMANDE ═════════════════════════════════════════ */

  // Recherche instantanée : sur trois lettres, toute la carte est balayée.
  const recherche = filtreCarte.trim().toLowerCase();
  const familles = etat.carte;
  if(familleActive >= familles.length) familleActive = 0;
  const liste = recherche
    ? familles.flatMap(f=>f.produits
        .filter(p=>p.nom.toLowerCase().includes(recherche))
        .map(p=>({ ...p, poste:f.poste })))
    : (familles[familleActive]?.produits || []).map(p=>({ ...p, poste:familles[familleActive].poste }));

  const st = sousTotal(c), total = totalDe(c), tva = ventilationTva(total);

  el.innerHTML = `<div class="ecran-commande">
    <div class="panneau-carte">
      <div class="barre-carte">
        <div class="recherche">${ico('recherche',17)}
          <input class="champ" id="q" placeholder="Rechercher un plat, une boisson…" value="${echap(filtreCarte)}">
        </div>
        ${recherche?`<button class="btn petit fantome" id="videRech">${ico('croix',15)} Effacer</button>`:''}
        <span class="pousse puce neutre">${liste.length} article${liste.length>1?'s':''}</span>
      </div>

      ${recherche?'':`<div class="familles">
        ${familles.map((f,i)=>`<button class="famille ${i===familleActive?'actif':''}" data-f="${i}">${echap(f.famille)}</button>`).join('')}
      </div>`}

      <div class="plats">
        ${liste.length ? liste.map((p,i)=>{
          const libre = c.boissonLibre && p.poste==='BAR';
          return `<button class="plat" data-p="${i}">
            <span class="marque" style="background:${p.poste==='BAR'?'var(--azur)':'var(--braise)'}"></span>
            <span class="nom">${echap(p.nom)}</span>

          </button>`;
        }).join('') : `<div class="vide" style="grid-column:1/-1">${ico('recherche',38)}<div>Aucun article ne correspond.</div></div>`}
      </div>
    </div>

    <aside class="panneau-ticket">
      <div class="ticket-tete">
        <div class="entre">
          <div><div style="font-weight:600;font-size:15px">${echap(c.tableNom)}</div>
            <div style="font-size:11.5px;color:var(--texte-3);margin-top:2px">
              ${c.num} · ${c.couverts} couvert${c.couverts>1?'s':''} · ${ecoule(c.ouvertA)}</div></div>
          <span class="puce ${ETATS[c.statut]?.p||'neutre'}">${ETATS[c.statut]?.lib||''}</span>
        </div>
      </div>

      <div class="ticket-lignes">
        ${c.lignes.length ? c.lignes.map((l,i)=>`
          <div class="ligne-art">
            <div class="h"><span>${echap(l.nom)}</span><span class="chiffre" style="font-weight:600">${fcfa(l.pu*l.qte)}</span></div>
            <div class="b">
              <span>${fcfa(l.pu)} l'unité${l.envoye?' · envoyé':''}</span>
              <span style="display:flex;gap:6px;align-items:center">
                <button class="btn petit fantome" data-note="${i}" title="Commentaire" style="padding:5px 8px">${ico('recu',14)}</button>
                <span class="compteur">
                  <button data-m="${i}">${ico('moins',14)}</button>
                  <span class="q chiffre">${l.qte}</span>
                  <button data-p2="${i}">${ico('plus',14)}</button>
                </span>
                <button class="btn petit fantome" data-x="${i}" style="padding:5px 8px;color:var(--alerte)">${ico('croix',14)}</button>
              </span>
            </div>
            ${l.note?`<div style="font-size:11.5px;color:var(--accent);margin-top:6px">${echap(l.note)}</div>`:''}
          </div>`).join('')
          : `<div class="vide">${ico('panier',38)}<div>Touchez un article pour composer la commande.</div></div>`}
      </div>

      <div class="ticket-pied">
        ${c.remise>0?`<div class="somme-ligne"><span>Sous-total</span><span class="chiffre">${fcfa(st)}</span></div>
                      <div class="somme-ligne"><span>Remise</span><span class="chiffre">−${fcfa(c.remise)}</span></div>`:''}
        ${tva.taux?`<div class="somme-ligne"><span>dont TVA ${tva.taux}%</span><span class="chiffre">${fcfa(tva.tva)}</span></div>`:''}
        <div class="somme-totale"><span class="l">Total</span><span class="v chiffre">${fcfa(total)}</span></div>

        <div class="actions-ticket">
          <button class="btn" id="aEnvoyer" ${c.lignes.every(l=>l.envoye)?'disabled':''}>${ico('cuisine',16)} Envoyer</button>
          <button class="btn" id="aAddition" ${total?'':'disabled'}>${ico('imprimer',16)} Addition</button>
          ${peut('remise')?`<button class="btn fantome" id="aRemise">Remise</button>`:''}
          <button class="btn valide" id="aPayer" ${total?'':'disabled'} style="${peut('remise')?'':'grid-column:1/-1'}">
            ${ico('argent',16)} Encaisser</button>
          <button class="btn risque petit" id="aAnnuler" style="grid-column:1/-1">Annuler la commande</button>
        </div>
      </div>
    </aside>
  </div>`;

  const q = $('#q',el);
  q.oninput = ()=>{
    filtreCarte = q.value;
    vueCommande();
    const nouveau = $('#q'); nouveau.focus();
    nouveau.setSelectionRange(nouveau.value.length, nouveau.value.length);
  };
  $('#videRech',el)?.addEventListener('click',()=>{ filtreCarte=''; vueCommande(); });
  $$('.famille',el).forEach(b=>b.onclick=()=>{ familleActive = Number(b.dataset.f); vueCommande(); });
  $$('.plat',el).forEach(b=>b.onclick=()=>choisirPlat(c, liste[Number(b.dataset.p)], champ));
  $$('[data-m]',el).forEach(b=>b.onclick=()=>ajusterQte(c, Number(b.dataset.m), -1));
  $$('[data-p2]',el).forEach(b=>b.onclick=()=>ajusterQte(c, Number(b.dataset.p2), 1));
  $$('[data-x]',el).forEach(b=>b.onclick=()=>retirerLigne(c, Number(b.dataset.x)));
  $$('[data-note]',el).forEach(b=>b.onclick=()=>commenter(c, Number(b.dataset.note)));

  $('#aEnvoyer',el).onclick  = ()=>envoyer(c);
  $('#aAddition',el).onclick = ()=>imprimer(ticketDe(c,'ADDITION'));
  $('#aRemise',el)?.addEventListener('click',()=>pave({ titre:'Remise', sous:'Montant déduit du total',
    valeur:String(c.remise||''), valider:v=>{ c.remise = Math.min(v, sousTotal(c)); sauver(); vueCommande(); }}));
  $('#aPayer',el).onclick = ()=>ouvrirCaisse(c);
  $('#aAnnuler',el).onclick = ()=>{
    const supprimer = ()=>{
      delete etat.encours[c.id];
      etat.tables[c.tableCle] = { statut:'LIBRE', commandeId:null };
      tracer('Commande '+c.num+' annulée','erreur');
      sauver(); aller('salle'); avis('info','Commande annulée');
    };
    // Une commande déjà partie en cuisine ne s'annule pas sans autorisation.
    if(c.lignes.some(l=>l.envoye)) autoriser('Annulation d\'une commande déjà envoyée en production.', supprimer);
    else confirmer('Annuler la commande','La table sera libérée.',supprimer,'Annuler la commande');
  };
}

function choisirPlat(c, p, champ){
  if(!p) return;
  const libre = c.boissonLibre && p.poste==='BAR';
  if(libre){
    pave({ titre:p.nom, sous:'Boisson en libre-service — saisissez le prix pratiqué',
      valeur:String(p[champ]||''), coupures:[500,700,1000,1500],
      valider:v=>{ if(v>0) poser(c,p,v); }});
  } else poser(c, p, p[champ]);
}

function poser(c, p, pu){
  const existante = c.lignes.find(l=>l.nom===p.nom && l.pu===pu && !l.envoye && !l.note);
  if(existante) existante.qte++;
  else c.lignes.push({ nom:p.nom, pu, qte:1, poste:p.poste, envoye:false, note:'', statut:'ATTENTE' });
  sauver(); vueCommande();
}

function ajusterQte(c, i, delta){
  const l = c.lignes[i]; if(!l) return;
  l.qte += delta;
  if(l.qte <= 0) c.lignes.splice(i,1);
  sauver(); vueCommande();
}

function retirerLigne(c, i){
  const l = c.lignes[i]; if(!l) return;
  const faire = ()=>{ c.lignes.splice(i,1); sauver(); vueCommande(); };
  if(l.envoye) autoriser('Retrait de « '+l.nom+' », déjà envoyé en production.', faire);
  else faire();
}

function commenter(c, i){
  const l = c.lignes[i]; if(!l) return;
  fenetre({ titre:'Commentaire', sous:l.nom,
    corps:`<input class="champ" id="cm" value="${echap(l.note||'')}" placeholder="Sans piment, bien cuit, à emporter…">
      <div class="grille" style="grid-template-columns:repeat(3,1fr);margin-top:12px">
        ${['Sans piment','Bien cuit','À emporter','Peu salé','Sans oignon','Servir en premier']
          .map(s=>`<button class="btn petit fantome" data-r="${echap(s)}">${s}</button>`).join('')}
      </div>`,
    pied:`<button class="btn fantome" data-a>Annuler</button><button class="btn principal" data-v>Enregistrer</button>`,
    apres:(f,fermer)=>{
      const input = $('#cm',f);
      $$('[data-r]',f).forEach(b=>b.onclick=()=>{ input.value = b.dataset.r; });
      $('[data-a]',f).onclick = fermer;
      $('[data-v]',f).onclick = ()=>{ l.note = input.value.trim(); fermer(); sauver(); vueCommande(); };
    }});
}

function envoyer(c){
  const neuves = c.lignes.filter(l=>!l.envoye);
  if(!neuves.length) return avis('info','Aucun nouvel article à envoyer');

  const cuisine = neuves.filter(l=>l.poste !== 'BAR');
  const bar     = neuves.filter(l=>l.poste === 'BAR');
  if(cuisine.length) imprimer(ticketDe(c,'CUISINE',cuisine));
  if(bar.length)     imprimer(ticketDe(c,'BAR',bar));

  consommerStock(neuves, c.num);
  neuves.forEach(l=>{ l.envoye = true; l.statut = 'ATTENTE'; l.envoyeA = new Date().toISOString(); });
  c.statut = 'ENVOYEE';
  c.envoyeA = c.envoyeA || new Date().toISOString();
  etat.tables[c.tableCle] = { statut:'ENVOYEE', commandeId:c.id };
  tracer(c.tableNom+' — '+neuves.length+' article(s) envoyé(s) en production');
  sauver(); vueCommande();
  avis('succes','Commande envoyée en production');
}

/* ═══ 12. CAISSE ════════════════════════════════════════════════════ */

function ouvrirCaisse(c){
  const total = totalDe(c);
  let moyen = 'ESPECES', saisie = '', partiels = [];
  const reste = ()=> total - partiels.reduce((s,p)=>s+p.montant,0);

  const dessin = ()=>{
    const v = Number(saisie||0);
    const rendu = MOYENS[moyen].rendu ? Math.max(0, v - reste()) : 0;
    return `
      <div class="grille" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
        <div>
          <div class="carte" style="padding:18px;background:var(--fond-2)">
            <div class="somme-ligne"><span>Total à régler</span><span class="chiffre">${fcfa(total)}</span></div>
            ${partiels.length?`<div class="somme-ligne"><span>Déjà encaissé</span><span class="chiffre">−${fcfa(total-reste())}</span></div>`:''}
            <div class="somme-totale"><span class="l">Reste</span>
              <span class="v chiffre" style="color:var(--accent)">${fcfa(reste())}</span></div>
          </div>

          <label class="eti" style="margin-top:18px">Moyen de paiement</label>
          <div class="paiements">
            ${Object.entries(MOYENS).map(([k,m])=>`
              <button class="moyen ${moyen===k?'actif':''}" data-moyen="${k}">
                <span class="rondelle" style="background:${m.c}">${m.court}</span>${m.lib}</button>`).join('')}
          </div>

          ${rendu>0?`<div class="carte" style="padding:15px;margin-top:16px;border-color:var(--menthe);background:var(--menthe-doux)">
            <div class="entre"><span style="color:var(--menthe);font-size:13px;font-weight:600">Monnaie à rendre</span>
              <span class="chiffre" style="font-family:var(--titrage);font-size:24px;font-weight:700;color:var(--menthe)">${fcfa(rendu)}</span></div>
          </div>`:''}

          ${partiels.length?`<div class="carte" style="padding:14px;margin-top:14px">
            <label class="eti">Paiement mixte</label>
            ${partiels.map((p,i)=>`<div class="entre" style="margin-top:8px">
              <span style="font-size:13px;display:flex;align-items:center;gap:8px">
                <span class="rond" style="background:${MOYENS[p.moyen].c}"></span>${MOYENS[p.moyen].lib}</span>
              <span style="display:flex;align-items:center;gap:10px">
                <b class="chiffre">${fcfa(p.montant)}</b>
                <button data-sup="${i}" style="color:var(--alerte)">${ico('croix',15)}</button></span>
            </div>`).join('')}
          </div>`:''}
        </div>

        <div>
          <div class="afficheur chiffre">${saisie===''?'0':nb(v)}</div>
          <div class="coupures">
            ${[500,1000,2000,5000,10000].map(x=>`<button data-c="${x}" class="chiffre">${nb(x)}</button>`).join('')}
            <button data-appoint>Appoint</button>
          </div>
          <div class="pave">${['7','8','9','4','5','6','1','2','3','00','0','←'].map(t=>`<button data-t="${t}">${t}</button>`).join('')}</div>
          <button class="btn large fantome" data-mixte style="margin-top:10px" ${v>0&&v<reste()?'':'disabled'}>
            ${ico('plus',15)} Ajouter au paiement mixte</button>
        </div>
      </div>`;
  };

  fenetre({ titre:'Encaissement', sous:`${c.num} — ${c.tableNom} — ${c.couverts} couvert(s)`, large:true, corps:dessin(),
    pied:`<button class="btn fantome" data-fermer>Fermer</button>
          <button class="btn valide" data-valider>${ico('check',16)} Valider et imprimer</button>`,
    apres:(fen,fermer)=>{
      const refaire = ()=>{ $('.corps',fen).innerHTML = dessin(); brancher(); };
      const brancher = ()=>{
        $$('[data-moyen]',fen).forEach(b=>b.onclick=()=>{ moyen = b.dataset.moyen; refaire(); });
        $$('[data-t]',fen).forEach(b=>b.onclick=()=>{
          const t = b.dataset.t;
          if(t==='←') saisie = saisie.slice(0,-1);
          else if(t==='00') saisie = saisie===''?'':saisie+'00';
          else if(saisie.length<9) saisie = (saisie+t).replace(/^0+(?=\d)/,'');
          refaire();
        });
        $$('[data-c]',fen).forEach(b=>b.onclick=()=>{ saisie = b.dataset.c; refaire(); });
        $('[data-appoint]',fen).onclick = ()=>{ saisie = String(reste()); refaire(); };
        $$('[data-sup]',fen).forEach(b=>b.onclick=()=>{ partiels.splice(Number(b.dataset.sup),1); refaire(); });
        $('[data-mixte]',fen).onclick = ()=>{
          const v = Number(saisie||0);
          if(v<=0 || v>=reste()) return avis('erreur','Montant invalide pour un règlement partiel');
          partiels.push({ moyen, montant:v, recu:v, rendu:0 });
          saisie = ''; refaire();
        };
      };
      brancher();
      $('[data-fermer]',fen).onclick = fermer;
      $('[data-valider]',fen).onclick = ()=>{
        const liste = [...partiels];
        const v = Number(saisie||0), du = reste();
        if(du > 0){
          if(v <= 0) return avis('erreur','Saisissez le montant reçu');
          if(v < du) return avis('erreur','Montant insuffisant : il reste '+fcfa(du));
          liste.push({ moyen, montant:du, recu:v, rendu: MOYENS[moyen].rendu ? v-du : 0 });
        }
        if(!liste.length) return avis('erreur','Aucun règlement saisi');
        fermer(); solder(c, liste);
      };
    }});
}

function solder(c, paiements){
  c.paiements = paiements;
  c.statut = 'PAYEE';
  c.payeA = new Date().toISOString();
  c.total = totalDe(c);
  c.tva = ventilationTva(c.total);
  c.encaissePar = etat.session.nom;

  etat.historique.unshift(clone(c));
  delete etat.encours[c.id];
  etat.tables[c.tableCle] = { statut:'PAYEE', commandeId:null };
  tracer(c.tableNom+' réglée — '+fcfa(c.total),'succes');
  sauver();

  if(etat.params.impressionAuto) imprimer(ticketDe(c,'RECU'));
  const rendu = paiements.reduce((s,p)=>s+(p.rendu||0),0);
  if(rendu > 0) avis('info','Monnaie à rendre : '+fcfa(rendu));
  avis('succes','Ticket '+c.num+' réglé');
  aller('salle');
}

/* ═══ 13. ÉCRAN CUISINE ═════════════════════════════════════════════ */

const ETAPES = {
  ATTENTE:      { lib:'À préparer',    suivant:'PREPARATION', p:'accent' },
  PREPARATION:  { lib:'En préparation',suivant:'PRETE',       p:'violet' },
  PRETE:        { lib:'Prête',         suivant:'SERVIE',      p:'azur'   },
  SERVIE:       { lib:'Servie',        suivant:null,          p:'menthe' },
};

function vueCuisine(){
  const el = $('#v-cuisine');
  el.style.flexDirection = 'column';

  // Un bon par commande, trié du plus ancien au plus récent.
  const bons = Object.values(etat.encours)
    .map(c=>({ c, items:c.lignes.filter(l=>l.envoye && l.statut!=='SERVIE') }))
    .filter(b=>b.items.length)
    .sort((a,b)=>new Date(a.c.envoyeA||a.c.ouvertA) - new Date(b.c.envoyeA||b.c.ouvertA));

  el.innerHTML = `
    <div class="zones-onglets">
      <span class="puce accent">${bons.length} bon${bons.length>1?'s':''} en cours</span>
      <div class="pousse" style="display:flex;gap:14px;font-size:11.5px;color:var(--texte-3)">
        <span style="display:flex;align-items:center;gap:6px"><span class="rond" style="background:var(--menthe)"></span>moins de 10 min</span>
        <span style="display:flex;align-items:center;gap:6px"><span class="rond" style="background:var(--accent)"></span>10 à 20 min</span>
        <span style="display:flex;align-items:center;gap:6px"><span class="rond" style="background:var(--alerte)"></span>plus de 20 min</span>
      </div>
    </div>
    <div class="bons" style="flex:1;overflow:auto">
      ${bons.length ? bons.map(({c,items})=>{
        const min = minutesDepuis(c.envoyeA || c.ouvertA);
        const urgence = min>20 ? 'chaud' : min>10 ? 'tiede' : '';
        return `<article class="bon ${urgence}">
          <div class="tete">
            <div><div style="font-family:var(--titrage);font-size:17px;font-weight:600">${echap(c.tableNom)}</div>
              <div style="font-size:11.5px;color:var(--texte-3);margin-top:2px">${c.num} · ${c.couverts} couvert${c.couverts>1?'s':''}</div></div>
            <span class="puce ${min>20?'alerte':min>10?'accent':'menthe'} chiffre">${ecoule(c.envoyeA||c.ouvertA)}</span>
          </div>
          <div class="items">
            ${items.map((l,i)=>`<div class="item">
              <span class="q chiffre">${l.qte}×</span>
              <div style="flex:1">
                <div style="font-size:13.5px">${echap(l.nom)}</div>
                ${l.note?`<div style="font-size:11.5px;color:var(--accent);margin-top:2px">${echap(l.note)}</div>`:''}
                <span class="puce ${ETAPES[l.statut||'ATTENTE'].p}" style="margin-top:5px">${ETAPES[l.statut||'ATTENTE'].lib}</span>
              </div>
              <button class="btn petit fantome" data-avancer="${c.id}|${c.lignes.indexOf(l)}">
                ${ETAPES[l.statut||'ATTENTE'].suivant ? ico('check',14) : ''}</button>
            </div>`).join('')}
          </div>
          <div class="pied">
            <button class="btn petit" data-tout="${c.id}|PREPARATION">En préparation</button>
            <button class="btn petit valide" data-tout="${c.id}|SERVIE">Tout servi</button>
          </div>
        </article>`;
      }).join('') : `<div class="vide" style="grid-column:1/-1">${ico('cuisine',38)}<div>Aucun bon en attente. La cuisine est à jour.</div></div>`}
    </div>`;

  $$('[data-avancer]',el).forEach(b=>b.onclick=()=>{
    const [id,idx] = b.dataset.avancer.split('|');
    const c = etat.encours[id]; const l = c?.lignes[Number(idx)];
    if(!l) return;
    const suite = ETAPES[l.statut||'ATTENTE'].suivant;
    if(suite){ l.statut = suite; majEtatCommande(c); sauver(); vueCuisine(); }
  });
  $$('[data-tout]',el).forEach(b=>b.onclick=()=>{
    const [id,cible] = b.dataset.tout.split('|');
    const c = etat.encours[id]; if(!c) return;
    c.lignes.filter(l=>l.envoye).forEach(l=>l.statut = cible);
    majEtatCommande(c); sauver(); vueCuisine();
  });
}

/* L'état de la table suit celui de ses articles. */
function majEtatCommande(c){
  const envoyees = c.lignes.filter(l=>l.envoye);
  if(!envoyees.length) return;
  const toutesServies = envoyees.every(l=>l.statut === 'SERVIE');
  const enCours = envoyees.some(l=>['PREPARATION','PRETE'].includes(l.statut));
  c.statut = toutesServies ? 'APAYER' : enCours ? 'ATTENTE' : 'ENVOYEE';
  etat.tables[c.tableCle] = { statut:c.statut, commandeId:c.id };
  if(toutesServies) tracer(c.tableNom+' — service terminé, en attente de règlement');
}

      <div style="display:flex;gap:8px">

    </div>

function appliquerMouvement(a, type, quantite, motif){
  const avant = a.qte;
  a.qte = type==='INVENTAIRE' ? quantite
        : type==='ENTREE'     ? Math.round((a.qte+quantite)*1000)/1000
        :                       Math.round((a.qte-quantite)*1000)/1000;
  etat.mouvements.unshift({ t:new Date().toISOString(), article:a.nom, type,
    qte:Math.abs(a.qte-avant), avant, apres:a.qte, motif, par:etat.session.nom });
  sauver();
}

function mouvementStock(a){
  if(!a) return;
  let type = 'ENTREE', quantite = '', motif = '';
  const dessin = ()=>`
    <div class="grille" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      ${['ENTREE','SORTIE','PERTE','INVENTAIRE'].map(t=>`
        <button class="btn petit ${type===t?'principal':'fantome'}" data-t="${t}">${t[0]+t.slice(1).toLowerCase()}</button>`).join('')}
    </div>
    <label class="eti">${type==='INVENTAIRE'?'Quantité comptée physiquement':'Quantité'} (${echap(a.unite)})</label>
    <input class="champ chiffre" id="qte" type="number" min="0" step="0.001" value="${quantite}">
    <label class="eti" style="margin-top:14px">Motif</label>
    <input class="champ" id="motif" value="${echap(motif)}" placeholder="Livraison, casse, réajustement…">
    <p style="color:var(--texte-3);font-size:12.5px;margin:14px 0 0">
      Stock actuel : <b class="chiffre">${a.qte} ${echap(a.unite)}</b> · seuil d'alerte ${a.seuil}</p>`;

  fenetre({ titre:a.nom, sous:a.famille, corps:dessin(),
    pied:`<button class="btn fantome" data-a>Annuler</button><button class="btn principal" data-v>Enregistrer</button>`,
    apres:(f,fermer)=>{
      const brancher = ()=>$$('[data-t]',f).forEach(b=>b.onclick=()=>{
        quantite = $('#qte',f).value; motif = $('#motif',f).value;
        type = b.dataset.t; $('.corps',f).innerHTML = dessin(); brancher();
      });
      brancher();
      $('[data-a]',f).onclick = fermer;
      $('[data-v]',f).onclick = ()=>{
        const q = Number($('#qte',f).value);
        if(!(q>=0)) return avis('erreur','Quantité invalide');
        appliquerMouvement(a, type, q, $('#motif',f).value || type);
        fermer(); vueStock(); avis('succes','Mouvement enregistré');
      };
    }});
}

function nouvelArticle(){
  fenetre({ titre:'Nouvel article de stock',
    corps:`<div class="grille" style="grid-template-columns:1fr 1fr">
      <div style="grid-column:1/-1"><label class="eti">Nom</label><input class="champ" id="n"></div>

    pied:`<button class="btn fantome" data-a>Annuler</button><button class="btn principal" data-v>Créer</button>`,

          unite:$('#u',f).value.trim()||'pièce', qte:Number($('#q',f).value)||0,

function inventaire(){
  fenetre({ titre:'Inventaire', sous:'Saisissez les quantités réellement comptées', large:true,
    corps:`<table class="tab"><thead><tr><th>Article</th><th class="d">Théorique</th><th class="d">Compté</th></tr></thead>
      <tbody>${etat.stock.map(a=>`<tr><td>${echap(a.nom)}</td>
        <td class="d chiffre" style="color:var(--texte-3)">${a.qte} ${echap(a.unite)}</td>
        <td class="d"><input class="champ chiffre" data-inv="${a.id}" type="number" step="0.001"
          style="max-width:120px;text-align:right" placeholder="${a.qte}"></td></tr>`).join('')}</tbody></table>`,
    pied:`<button class="btn fantome" data-a>Annuler</button><button class="btn principal" data-v>Valider l'inventaire</button>`,
    apres:(f,fermer)=>{
      $('[data-a]',f).onclick = fermer;
      $('[data-v]',f).onclick = ()=>{
        let n = 0;
        $$('[data-inv]',f).forEach(inp=>{
          if(inp.value === '') return;
          const a = etat.stock.find(x=>x.id===inp.dataset.inv);
          if(a && Number(inp.value) !== a.qte){ appliquerMouvement(a,'INVENTAIRE',Number(inp.value),'Inventaire'); n++; }
        });
        fermer(); vueStock(); avis('succes', n+' article(s) réajusté(s)');
      };
    }});
}

let periode = 'jour';

function bornes(p){
  const d = new Date(); const fin = new Date(d); fin.setHours(23,59,59,999);
  const debut = new Date(d); debut.setHours(0,0,0,0);
  if(p==='semaine') debut.setDate(debut.getDate()-6);
  if(p==='mois')    debut.setDate(1);
  if(p==='annee')   { debut.setMonth(0); debut.setDate(1); }
  return { debut, fin };
}

function analyse(p){
  const { debut, fin } = bornes(p);
  const tickets = etat.historique.filter(c=>{
    const t = new Date(c.payeA||c.ouvertA);
    return t >= debut && t <= fin;
  });
  const grouper = (fn)=>{ const m = {}; tickets.forEach(c=>{ const k = fn(c); m[k] = (m[k]||0) + c.total; }); return m; };

  const parPlat = {}, parFamille = {}, parMoyen = {};
  const familleDe = nom => etat.carte.find(f=>f.produits.some(x=>x.nom===nom))?.famille || 'Autres';
  tickets.forEach(c=>{
    c.lignes.forEach(l=>{
      const e = parPlat[l.nom] || { q:0, t:0 };
      e.q += l.qte; e.t += l.pu*l.qte; parPlat[l.nom] = e;
      parFamille[familleDe(l.nom)] = (parFamille[familleDe(l.nom)]||0) + l.pu*l.qte;
    });
    (c.paiements||[]).forEach(pm=>{ parMoyen[pm.moyen] = (parMoyen[pm.moyen]||0) + pm.montant; });
  });

  const ca = tickets.reduce((s,c)=>s+c.total,0);
  return {
    debut, fin, tickets, ca,
    couverts: tickets.reduce((s,c)=>s+c.couverts,0),
    remises: tickets.reduce((s,c)=>s+(c.remise||0),0),
    moyen: tickets.length ? Math.round(ca/tickets.length) : 0,
    parServeur: grouper(c=>c.serveur||'—'),
    parCaisse: grouper(c=>c.encaissePar||'—'),
    parZone: grouper(c=>c.zoneNom),
    parPlat, parFamille, parMoyen,
  };
}

function imprimerRapport(a){
  const tri = o => Object.entries(o).sort((x,y)=>y[1]-x[1]);
  const tableau = (titre, lignes) => `
    <h2>${titre}</h2><table><thead><tr><th>Libellé</th><th class="d">Montant</th><th class="d">Part</th></tr></thead>

  imprimerFeuille(`<div class="rapport">
    <h1>${echap(etat.params.nom)}</h1>
    <p>Rapport ${periode} — du ${dateFR(a.debut)} au ${dateFR(a.fin)}<br>
       Édité le ${dateFR(new Date())} à ${hhmm(new Date())} par ${echap(etat.session.nom)}</p>
    <h2>Synthèse</h2>
    <table><tbody>
      <tr><td>Chiffre d'affaires</td><td class="d">${nb(a.ca)} ${echap(etat.params.devise)}</td></tr>
      <tr><td>Nombre de tickets</td><td class="d">${a.tickets.length}</td></tr>
      <tr><td>Ticket moyen</td><td class="d">${nb(a.moyen)}</td></tr>
      <tr><td>Couverts servis</td><td class="d">${a.couverts}</td></tr>
      <tr><td>Remises accordées</td><td class="d">${nb(a.remises)}</td></tr>
    </tbody></table>
    ${tableau('Par mode de paiement', tri(a.parMoyen).map(([k,v])=>[MOYENS[k]?.lib||k,v]))}
    ${tableau('Par espace', tri(a.parZone))}
    ${tableau('Par serveur', tri(a.parServeur))}
    ${tableau('Par catégorie', tri(a.parFamille))}
    <h2>Par plat</h2>
    <table><thead><tr><th>Plat</th><th class="d">Quantité</th><th class="d">Total</th></tr></thead>
    <tbody>${Object.entries(a.parPlat).sort((x,y)=>y[1].t-x[1].t).map(([n,e])=>
      `<tr><td>${echap(n)}</td><td class="d">${e.q}</td><td class="d">${nb(e.t)}</td></tr>`).join('')}</tbody></table>
  </div>`);

function telecharger(contenu, nom, type){
  const url = URL.createObjectURL(new Blob([contenu],{type}));
  const a = document.createElement('a');
  a.href = url; a.download = nom; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function exporterExcel(a){
  const l = [['Ticket','Date','Heure','Espace','Table','Couverts','Serveur','Caisse','Article','Quantite','PrixUnitaire','TotalLigne','TotalTicket','Reglements']];
  a.tickets.forEach(c=>{
    const r = (c.paiements||[]).map(p=>MOYENS[p.moyen]?.lib||p.moyen).join(' + ');
    c.lignes.forEach(x=>l.push([c.num, dateFR(c.payeA), hhmm(c.payeA), c.zoneNom, c.tableNom,
      c.couverts, c.serveur||'', c.encaissePar||'', x.nom, x.qte, x.pu, x.pu*x.qte, c.total, r]));
  });
  // Le point-virgule et le BOM garantissent une ouverture propre dans Excel en français.
  telecharger('\ufeff'+l.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'),
    'kossipo-ventes-'+periode+'-'+jourISO()+'.csv', 'text/csv;charset=utf-8');
}
