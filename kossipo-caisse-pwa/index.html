        <div class="grille" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
          ${etat.zones.map((z,i)=>`<div class="carte" style="padding:14px;background:var(--fond-2)">
            <div style="font-weight:600;display:flex;align-items:center;gap:8px">
              <span class="rond" style="background:${z.couleur}"></span>${echap(z.nom)}</div>
            <label class="eti" style="margin-top:12px">Nombre de tables</label>
            <input class="champ chiffre" type="number" min="1" max="60" value="${z.tables}" data-tables="${i}">
            <p style="font-size:11.5px;color:var(--texte-3);margin:9px 0 0">
              Tarif ${z.grille==='vip'?'VIP':'Terrasse'}${z.boissonLibre?' · boissons à prix libre':''}</p>
          </div>`).join('')}
        </div>
      </div>`,

    equipe: ()=>`
      <div class="carte" style="overflow:hidden">
        <div class="entre" style="padding:16px 18px;border-bottom:1px solid var(--trait)">
          <h3 style="font-size:15px">Utilisateurs et permissions</h3>
          <button class="btn petit principal" id="uAjout">${ico('plus',15)} Ajouter</button>
        </div>
        <table class="tab"><thead><tr><th>Nom</th><th>Profil</th><th>Droits</th><th>Code PIN</th><th class="d">État</th><th class="d"></th></tr></thead>
          <tbody>${etat.utilisateurs.map(u=>`<tr style="${u.actif?'':'opacity:.5'}">
            <td style="font-weight:500">${echap(u.nom)}</td>
            <td><span class="puce ${u.role==='ADMIN'?'accent':u.role==='GERANT'?'violet':'neutre'}">${ROLES[u.role].lib}</span></td>
            <td style="color:var(--texte-3);font-size:12px">${ROLES[u.role].droits.includes('*')?'Accès complet':ROLES[u.role].droits.join(', ')}</td>
            <td class="chiffre" style="color:var(--texte-3)">${'•'.repeat(u.pin.length)}</td>
            <td class="d">${u.actif?'<span class="puce menthe">Actif</span>':'<span class="puce neutre">Désactivé</span>'}</td>
            <td class="d" style="white-space:nowrap">
              <button class="btn petit fantome" data-upin="${u.id}">${ico('cle',14)}</button>
              <button class="btn petit fantome" data-ubas="${u.id}">${u.actif?'Désactiver':'Réactiver'}</button></td>
          </tr>`).join('')}</tbody></table>
      </div>`,

    imprimante: ()=>`
      <div class="carte" style="padding:20px">
        <h3 style="font-size:15px;margin-bottom:16px">Mode d'impression</h3>
        <div class="paiements" style="grid-template-columns:repeat(3,1fr)">
          ${[['navigateur','Système','Windows, Mac'],['bluetooth','Bluetooth','ESC/POS direct'],['rawbt','RawBT','Android']]
            .map(([k,l,d])=>`<button class="moyen ${p.mode===k?'actif':''}" data-mode="${k}">
              ${ico('imprimer',20)}<span>${l}</span>
              <span style="font-size:10.5px;color:var(--texte-3);font-weight:400">${d}</span></button>`).join('')}
        </div>
        <p style="font-size:13px;color:var(--texte-2);margin:16px 0 0;line-height:1.6" id="aideMode"></p>

        <div class="grille" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:20px">
          <div><label class="eti">Largeur du papier</label>
            <div style="display:flex;gap:8px">
              ${[58,80].map(w=>`<button class="btn ${Number(p.largeur)===w?'principal':'fantome'}" data-larg="${w}"
                style="flex:1">${w} mm</button>`).join('')}
            </div></div>
          <div><label class="eti">Reçu à l'encaissement</label>
            <div style="display:flex;gap:8px">
              <button class="btn ${p.impressionAuto?'principal':'fantome'}" data-auto="1" style="flex:1">Automatique</button>
              <button class="btn ${p.impressionAuto?'fantome':'principal'}" data-auto="0" style="flex:1">Manuel</button>
            </div></div>
        </div>

        <div style="display:flex;gap:9px;margin-top:20px;flex-wrap:wrap">
          <button class="btn principal" id="iTest">${ico('imprimer',16)} Ticket de test</button>
          ${p.mode==='bluetooth'?`<button class="btn" id="iBt">Connecter l'imprimante</button>`:''}
        </div>
      </div>`,

    donnees: ()=>`
      <div class="carte" style="padding:20px">
        <h3 style="font-size:15px;margin-bottom:8px">Sauvegarde et restauration</h3>
        <p style="font-size:13px;color:var(--texte-2);line-height:1.6;margin:0 0 18px">
          Les ventes sont enregistrées dans ce poste. Exportez régulièrement : le fichier obtenu
          se recharge sur n'importe quel autre poste.</p>
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn principal" id="dExport">${ico('telecharger',16)} Exporter la sauvegarde</button>
          <button class="btn" id="dImport">Restaurer un fichier</button>
          <button class="btn risque" id="dPurge">Archiver et vider l'historique</button>
          <button class="btn risque" id="dReset">Tout réinitialiser</button>
        </div>
        <input type="file" id="dFichier" accept="application/json" style="display:none">
        <div class="grille" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:22px">
          ${[['Version',VERSION],['Tickets en mémoire',etat.historique.length],
             ['Tables ouvertes',Object.keys(etat.encours).length],
             ['Mouvements de stock',etat.mouvements.length]].map(([l,v])=>`
            <div class="carte" style="padding:14px;background:var(--fond-2)">
              <div class="lib" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--texte-3)">${l}</div>
              <div class="chiffre" style="font-family:var(--titrage);font-size:19px;font-weight:600;margin-top:6px">${v}</div>
            </div>`).join('')}
        </div>
      </div>`,
  };

  el.innerHTML = `
    <div style="display:flex;gap:7px;margin-bottom:16px;overflow-x:auto">
      ${sections.map(([k,l])=>`<button class="btn petit ${ongletAdmin===k?'principal':'fantome'}" data-sec="${k}">${l}</button>`).join('')}
    </div>
    ${contenu[ongletAdmin]()}`;

  $$('[data-sec]',el).forEach(b=>b.onclick=()=>{ ongletAdmin = b.dataset.sec; vueReglages(); });
  brancherAdmin(el);
}

function brancherAdmin(el){
  // ─ Restaurant
  $$('[data-par]',el).forEach(inp=>inp.onchange=()=>{
    const k = inp.dataset.par;
    etat.params[k] = k==='tvaIncluse' ? inp.value==='true'
                   : k==='tva' ? Number(inp.value)||0
                   : inp.value;
    sauver(); avis('succes','Paramètre enregistré');
  });

  // ─ Carte
  $$('[data-nom]',el).forEach(inp=>inp.onchange=()=>{
    const [f,x] = inp.dataset.nom.split('.').map(Number);
    etat.carte[f].produits[x].nom = inp.value.trim() || 'Sans nom';
    sauver(); avis('succes','Carte mise à jour');
  });
  $$('[data-prix]',el).forEach(inp=>inp.onchange=()=>{
    const [f,x,g] = inp.dataset.prix.split('.');
    etat.carte[f].produits[x][g] = Math.max(0, Number(inp.value)||0);
    sauver(); avis('succes','Tarif enregistré');
  });
  $$('[data-sup]',el).forEach(b=>b.onclick=()=>{
    const [f,x] = b.dataset.sup.split('.').map(Number);
    confirmer('Retirer l\'article', etat.carte[f].produits[x].nom+' sera retiré de la carte.',
      ()=>{ etat.carte[f].produits.splice(x,1); sauver(); vueReglages(); });
  });
  $$('[data-add]',el).forEach(b=>b.onclick=()=>{
    etat.carte[Number(b.dataset.add)].produits.push({ nom:'Nouvel article', terrasse:1000, vip:1000 });
    sauver(); vueReglages();
  });
  $$('[data-tables]',el).forEach(inp=>inp.onchange=()=>{
    etat.zones[Number(inp.dataset.tables)].tables = Math.max(1, Number(inp.value)||1);
    sauver(); avis('succes','Plan de salle mis à jour');
  });

  // ─ Utilisateurs
  $('#uAjout',el)?.addEventListener('click', ajouterUtilisateur);
  $$('[data-upin]',el).forEach(b=>b.onclick=()=>{
    const u = etat.utilisateurs.find(x=>x.id===b.dataset.upin);
    pave({ titre:'Code PIN de '+u.nom, sous:'4 à 8 chiffres', libelle:'Enregistrer',
      valider:v=>{ const s = String(v);
        if(s.length<4) return avis('erreur','Le code doit comporter au moins 4 chiffres');
        if(etat.utilisateurs.some(x=>x.id!==u.id && x.pin===s)) return avis('erreur','Ce code est déjà utilisé');
        u.pin = s; sauver(); vueReglages(); avis('succes','Code modifié'); }});
  });
  $$('[data-ubas]',el).forEach(b=>b.onclick=()=>{
    const u = etat.utilisateurs.find(x=>x.id===b.dataset.ubas);
    if(u.id === etat.session.id) return avis('erreur','Vous ne pouvez pas désactiver votre propre compte');
    u.actif = !u.actif; sauver(); vueReglages();
  });

  // ─ Imprimante
  const aides = {
    navigateur:"La boîte d'impression du système s'ouvre. Choisissez l'imprimante thermique, le format « Reçu » ou 80 mm, et des marges minimales. Chrome mémorise ensuite ce réglage.",
    bluetooth:"Les commandes ESC/POS partent directement vers l'imprimante, avec coupe automatique du papier. Fonctionne sur Chrome pour Android et Windows.",
    rawbt:"L'impression passe par l'application RawBT installée sur le téléphone Android, qui pilote l'imprimante Bluetooth ou USB.",
  };
  const aide = $('#aideMode',el);
  if(aide) aide.textContent = aides[etat.params.mode];
  $$('[data-mode]',el).forEach(b=>b.onclick=()=>{ etat.params.mode = b.dataset.mode; sauver(); vueReglages(); });
  $$('[data-larg]',el).forEach(b=>b.onclick=()=>{ etat.params.largeur = Number(b.dataset.larg); sauver(); vueReglages(); });
  $$('[data-auto]',el).forEach(b=>b.onclick=()=>{ etat.params.impressionAuto = b.dataset.auto==='1'; sauver(); vueReglages(); });
  $('#iTest',el)?.addEventListener('click',()=>imprimer(ticketTest()));
  $('#iBt',el)?.addEventListener('click', async ()=>{
    try{ avis('succes','Connectée : '+await connecterBluetooth()); }
    catch(e){ avis('erreur', e.message||String(e)); }
  });

  // ─ Données
  $('#dExport',el)?.addEventListener('click', exporterSauvegarde);
  $('#dImport',el)?.addEventListener('click',()=>$('#dFichier',el).click());
  const fichier = $('#dFichier',el);
  if(fichier) fichier.onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const lu = JSON.parse(await f.text());
      const session = etat.session;
      etat = fusion(etatNeuf(), lu);
      etat.session = session;
      sauver(); dessiner(); avis('succes','Sauvegarde restaurée');
    }catch(err){ avis('erreur','Fichier illisible'); }
  };
  $('#dPurge',el)?.addEventListener('click',()=>confirmer('Archiver et vider',
    'La sauvegarde est téléchargée avant la suppression des tickets.',
    ()=>{ exporterSauvegarde(); etat.historique = []; etat.activite = []; sauver(); vueReglages();
          avis('succes','Historique archivé'); }, 'Archiver et vider'));
  $('#dReset',el)?.addEventListener('click',()=>autoriser('Réinitialisation complète de l\'application.',
    ()=>{ exporterSauvegarde(); etat = etatNeuf(); sauver(); location.reload(); }));
}

function ajouterUtilisateur(){
  fenetre({ titre:'Nouvel utilisateur',
    corps:`<label class="eti">Nom</label><input class="champ" id="un">
      <label class="eti" style="margin-top:14px">Profil</label>
      <select class="champ" id="ur">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.lib}</option>`).join('')}</select>
      <label class="eti" style="margin-top:14px">Code PIN (4 à 8 chiffres)</label>
      <input class="champ chiffre" id="up" inputmode="numeric" maxlength="8">`,
    pied:`<button class="btn fantome" data-a>Annuler</button><button class="btn principal" data-v>Créer</button>`,
    apres:(f,fermer)=>{
      $('[data-a]',f).onclick = fermer;
      $('[data-v]',f).onclick = ()=>{
        const nom = $('#un',f).value.trim(), pin = $('#up',f).value.replace(/\D/g,'');
        if(!nom) return avis('erreur','Le nom est obligatoire');
        if(pin.length < 4) return avis('erreur','Code PIN trop court');
        if(etat.utilisateurs.some(u=>u.pin===pin)) return avis('erreur','Ce code est déjà utilisé');
        etat.utilisateurs.push({ id:'u'+Date.now().toString(36), nom, role:$('#ur',f).value, pin, actif:true });
        sauver(); fermer(); vueReglages(); avis('succes','Utilisateur créé');
      };
    }});
}

function exporterSauvegarde(){
  telecharger(JSON.stringify(etat,null,2), 'kossipo-sauvegarde-'+jourISO()+'.json', 'application/json');
}

function ticketTest(){
  return ticketDe({
    num:'TEST-0001', zoneNom:'Terrasse', tableNom:'Terrasse 1', serveur:etat.session?.nom||'Test',
    couverts:2, remise:0, paiements:[{moyen:'ESPECES',montant:5100,recu:10000,rendu:4900}],
    lignes:[{ nom:'Riz / Foutou sauce poulet', qte:2, pu:1500, note:'' },
            { nom:'Heineken', qte:3, pu:700, note:'bien fraîche' }],
  }, 'RECU');
}

/* ═══ 17. DÉMARRAGE ═════════════════════════════════════════════════ */

document.documentElement.dataset.theme = etat.theme || 'sombre';

// Les durées affichées et les alertes cuisine restent justes sans intervention.
setInterval(()=>{
  if(vue === 'salle') vueSalle();
  else if(vue === 'cuisine') vueCuisine();
  else if(vue === 'tableau') vueTableau();
}, 30000);

window.addEventListener('beforeunload', ()=>{
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
});

if(etat.session) dessiner(); else rendreConnexion();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
